[project]
name = "telco-counterfactual-twin-backend"
version = "0.1.0"
description = "Contract-first backend boundary for a synthetic telecom counterfactual twin"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2[brotli,http2,zstd]==2.12.0",
    "pynacl>=1.6.2,<2",
    "pydantic==2.13.4",
    "rfc8785>=0.1.4,<0.2",
    "typer>=0.21,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "check-jsonschema==0.37.4",
    "hypothesis>=6.0,<7",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telco_twin"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests", "../scripts"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests", "../scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "../scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607", "ARG", "PLR2004", "SLF001", "D"]
"../scripts/**/*.py" = ["T201", "INP001"]
"src/telco_twin/bootstrap/gcp_commands.py" = ["S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src", "../scripts"]
