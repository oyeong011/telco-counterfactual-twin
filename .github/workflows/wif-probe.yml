name: WIF authority probe
run-name: WIF authority probe / ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe mode
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deny-probe
      provider:
        description: Full temporary deny-provider resource name
        required: false
        type: string
      matching_provider:
        description: Full persistent matching-provider resource name
        required: false
        type: string
      service_account:
        description: Deploy service account for the deny probe
        required: false
        type: string
      project_id:
        description: GCP project for the deny probe
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  token-exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve configured authority
        id: authority
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          DENY_PROVIDER: ${{ inputs.provider }}
          MATCHING_PROVIDER: ${{ inputs.matching_provider }}
          DENY_SERVICE_ACCOUNT: ${{ inputs.service_account }}
          DENY_PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "deny-probe" ]]; then
            if [[ -z "$DENY_PROVIDER" || -z "$MATCHING_PROVIDER" || -z "$DENY_SERVICE_ACCOUNT" || -z "$DENY_PROJECT_ID" ]]; then
              echo "workflow-result=deny-invalid-input"
              exit 1
            fi
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "deny-authority-config=present"
            exit 0
          fi
          if [[ -z "$GCP_PROJECT_ID" || -z "$GCP_WIF_PROVIDER" || -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "workflow-result=auth-blocked"
            exit 0
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "authority-config=present"
      - name: Authenticate through the exact WIF provider
        if: inputs.mode == 'preflight' && steps.authority.outputs.blocked == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Prove the matching provider can exchange this GitHub claim
        id: control_auth
        if: inputs.mode == 'deny-probe'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.matching_provider }}
          service_account: ${{ inputs.service_account }}
          create_credentials_file: false
      - name: Attempt the temporary deny-provider exchange
        id: deny_auth
        if: inputs.mode == 'deny-probe' && steps.control_auth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.provider }}
          service_account: ${{ inputs.service_account }}
          create_credentials_file: false
      - name: Assert the deny-provider rejected GitHub OIDC
        if: always() && inputs.mode == 'deny-probe'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.control_auth.outcome }}" != "success" ]]; then
            echo "workflow-result=deny-control-failed"
            exit 1
          fi
          echo "workflow-result=deny-control-succeeded"
          if [[ "${{ steps.deny_auth.outcome }}" == "success" ]]; then
            echo "workflow-result=deny-unexpected-success"
            exit 1
          fi
          if [[ "${{ steps.deny_auth.outcome }}" != "failure" ]]; then
            echo "workflow-result=deny-invalid-outcome"
            exit 1
          fi
          echo "workflow-result=deny-rejected"
      - name: Install gcloud
        if: inputs.mode == 'preflight' && steps.authority.outputs.blocked == 'false'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Hash token exchange and read-only project evidence
        if: inputs.mode == 'preflight' && steps.authority.outputs.blocked == 'false'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          token_hash="$(gcloud auth print-access-token | sha256sum | cut -d' ' -f1)"
          project_hash="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)' | sha256sum | cut -d' ' -f1)"
          echo "access-token-receipt-sha256=$token_hash"
          echo "project-receipt-sha256=$project_hash"
          echo "workflow-result=success"
