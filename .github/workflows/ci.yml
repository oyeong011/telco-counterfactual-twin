name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.6"
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.4.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Bootstrap
        run: make bootstrap
      - name: Verify
        run: make verify
      - name: Security boundaries
        run: make security
      - name: Probe local Compose stack
        run: make probe
      - name: Regenerate release evidence
        run: make generate-release-evidence
      - name: Cleanup local Compose resources
        if: always()
        # The compose file requires both identities, so a bare teardown fails
        # interpolation and marks an otherwise green job red. Tear down the
        # stack under the identity it was built with.
        env:
          TWIN_RUNTIME_SOURCE_COMMIT_SHA: ${{ github.sha }}
          TWIN_RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose.yml down -v --remove-orphans
      - name: Upload non-secret release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: |
            artifacts/contracts/openapi.json
            artifacts/contracts/mcp-tools.json
            artifacts/eval/*.json
            artifacts/eval/*.jsonl
            artifacts/eval-v2/*.json
            artifacts/release/evidence-manifest.json
            artifacts/security/*.json
            frontend/public/build-info.json
          if-no-files-found: error
